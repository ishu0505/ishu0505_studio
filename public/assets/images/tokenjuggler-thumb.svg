<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="tokenjuggler: multi-provider LLM quota router">
  <!-- Warm paper background -->
  <rect width="240" height="160" fill="#fff8e8"/>
  <!-- Subtle notebook dashed grid lines -->
  <g stroke="#2a2a35" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="0" y1="32" x2="240" y2="32"/>
    <line x1="0" y1="64" x2="240" y2="64"/>
    <line x1="0" y1="96" x2="240" y2="96"/>
    <line x1="0" y1="128" x2="240" y2="128"/>
    <line x1="40" y1="0" x2="40" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
  </g>

  <!-- Left decorative shop roof (visible in wide card header) -->
  <g transform="translate(8, 52) rotate(-4)">
    <rect x="2" y="14" width="28" height="26" rx="4" fill="#fffdf7" stroke="#2a2a35" stroke-width="2.5"/>
    <path d="M0 14h32l-4-10H4z" fill="#ffc6dd" stroke="#2a2a35" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Right decorative shop roof (visible in wide card header) -->
  <g transform="translate(200, 52) rotate(4)">
    <rect x="2" y="14" width="28" height="26" rx="4" fill="#fffdf7" stroke="#2a2a35" stroke-width="2.5"/>
    <path d="M0 14h32l-4-10H4z" fill="#bfe0ff" stroke="#2a2a35" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- CENTRAL SAFE ZONE (x=46..194, y=10..150) -->
  <!-- Juggling Arcs & Token Balls -->
  <path d="M76 66 C88 20, 152 20, 164 66" fill="none" stroke="#2a2a35" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>
  <circle cx="76" cy="48" r="13" fill="#ff7aa8" stroke="#2a2a35" stroke-width="3"/>
  <text x="76" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9.5" fill="#2a2a35">GPT</text>

  <circle cx="120" cy="24" r="14" fill="#ffe98a" stroke="#2a2a35" stroke-width="3"/>
  <text x="120" y="28" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9.5" fill="#2a2a35">GEM</text>

  <circle cx="164" cy="48" r="13" fill="#b9efd3" stroke="#2a2a35" stroke-width="3"/>
  <text x="164" y="52" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9.5" fill="#2a2a35">CLD</text>

  <!-- Juggler Character in Center -->
  <circle cx="120" cy="76" r="16" fill="#ffd2b3" stroke="#2a2a35" stroke-width="3"/>
  <circle cx="114" cy="74" r="2.2" fill="#2a2a35"/>
  <circle cx="126" cy="74" r="2.2" fill="#2a2a35"/>
  <path d="M114 82q6 5 12 0" fill="none" stroke="#2a2a35" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M98 122V102a22 22 0 0 1 44 0v20z" fill="#d9c9fb" stroke="#2a2a35" stroke-width="3" stroke-linejoin="round"/>

  <!-- Bottom Label Pill -->
  <g transform="translate(50, 120)">
    <rect x="3" y="3" width="140" height="28" rx="10" fill="#2a2a35"/>
    <rect x="0" y="0" width="140" height="28" rx="10" fill="#b9efd3" stroke="#2a2a35" stroke-width="3"/>
    <text x="70" y="19" text-anchor="middle" font-family="'Gochi Hand', 'Patrick Hand', 'Comic Sans MS', cursive, sans-serif" font-weight="700" font-size="16.5" fill="#2a2a35">tokenjuggler</text>
  </g>
</svg>
