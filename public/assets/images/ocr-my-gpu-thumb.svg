<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="ocr_my_gpu: SGLang vs vLLM on 8GB GPU">
  <!-- Warm paper background -->
  <rect width="240" height="160" fill="#fff8e8"/>
  <!-- Subtle notebook dashed grid lines -->
  <g stroke="#2a2a35" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="0" y1="32" x2="240" y2="32"/>
    <line x1="0" y1="64" x2="240" y2="64"/>
    <line x1="0" y1="96" x2="240" y2="96"/>
    <line x1="0" y1="128" x2="240" y2="128"/>
    <line x1="40" y1="0" x2="40" y2="160"/>
    <line x1="200" y1="0" x2="200" y2="160"/>
  </g>

  <!-- Left side decorative scanned PDF page (visible in wide card header) -->
  <g transform="translate(8, 36) rotate(-5)">
    <rect x="3" y="3" width="32" height="44" rx="5" fill="#2a2a35"/>
    <rect x="0" y="0" width="32" height="44" rx="5" fill="#fffdf7" stroke="#2a2a35" stroke-width="2.5"/>
    <rect x="5" y="6" width="14" height="6" rx="2" fill="#ffc6dd" stroke="#2a2a35" stroke-width="1.8"/>
    <line x1="5" y1="18" x2="26" y2="18" stroke="#2a2a35" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="25" x2="24" y2="25" stroke="#2a2a35" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="32" x2="20" y2="32" stroke="#2a2a35" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Right side decorative GPU chip (visible in wide card header) -->
  <g transform="translate(198, 42) rotate(5)">
    <rect x="3" y="3" width="32" height="36" rx="6" fill="#2a2a35"/>
    <rect x="0" y="0" width="32" height="36" rx="6" fill="#d9c9fb" stroke="#2a2a35" stroke-width="2.5"/>
    <circle cx="16" cy="18" r="9" fill="#fffdf7" stroke="#2a2a35" stroke-width="2.2"/>
    <path d="M16 11v14M9 18h14" stroke="#2a2a35" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CENTRAL SAFE ZONE (x=46..194, y=10..150) — visible in both 64x64 square & wide card -->
  <!-- Top Header Badge: SGLang vs vLLM -->
  <g transform="translate(48, 10)">
    <rect x="3" y="3" width="144" height="32" rx="10" fill="#2a2a35"/>
    <rect x="0" y="0" width="144" height="32" rx="10" fill="#ffe98a" stroke="#2a2a35" stroke-width="3"/>
    <text x="72" y="21" text-anchor="middle" font-family="'Gochi Hand', 'Patrick Hand', 'Comic Sans MS', cursive, sans-serif" font-weight="700" font-size="17.5" fill="#2a2a35">SGLang vs vLLM</text>
  </g>

  <!-- Main Race Panel -->
  <g transform="translate(48, 49)">
    <rect x="4" y="4" width="144" height="68" rx="12" fill="#2a2a35"/>
    <rect x="0" y="0" width="144" height="68" rx="12" fill="#fffdf7" stroke="#2a2a35" stroke-width="3"/>

    <!-- SGLang Row -->
    <text x="8" y="22" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="700" font-size="10.5" fill="#2a2a35">SGLang</text>
    <rect x="54" y="10" width="80" height="16" rx="8" fill="#fff8e8" stroke="#2a2a35" stroke-width="2.2"/>
    <rect x="54" y="10" width="70" height="16" rx="8" fill="#b9efd3" stroke="#2a2a35" stroke-width="2.2"/>
    <!-- Lightning bolt badge -->
    <path d="M129 8l-4 7h4l-3 7 8-9h-4.5z" fill="#ff7aa8" stroke="#2a2a35" stroke-width="1.4" stroke-linejoin="round"/>

    <!-- VS Pill in middle -->
    <circle cx="26" cy="35" r="8" fill="#ffc6dd" stroke="#2a2a35" stroke-width="2"/>
    <text x="26" y="38" text-anchor="middle" font-family="'Gochi Hand', cursive, sans-serif" font-weight="700" font-size="9.5" fill="#2a2a35">VS</text>

    <!-- vLLM Row -->
    <text x="12" y="54" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="700" font-size="10.5" fill="#2a2a35">vLLM</text>
    <rect x="54" y="42" width="80" height="16" rx="8" fill="#fff8e8" stroke="#2a2a35" stroke-width="2.2"/>
    <rect x="54" y="42" width="58" height="16" rx="8" fill="#bfe0ff" stroke="#2a2a35" stroke-width="2.2"/>
  </g>

  <!-- Bottom 8GB GPU OCR Tag -->
  <g transform="translate(54, 124)">
    <rect x="3" y="3" width="132" height="24" rx="9" fill="#2a2a35"/>
    <rect x="0" y="0" width="132" height="24" rx="9" fill="#ffd2b3" stroke="#2a2a35" stroke-width="2.8"/>
    <circle cx="14" cy="12" r="5" fill="#ff7aa8" stroke="#2a2a35" stroke-width="2"/>
    <text x="72" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="700" font-size="10.5" fill="#2a2a35">8GB GPU · OCR</text>
  </g>
</svg>
